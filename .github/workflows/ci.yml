name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build

  api-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: api/go.sum
      - name: Vet and Test
        run: |
          cd api
          go vet ./...
          go test -v ./...

  terraform-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Check Terraform formatting
        run: |
          terraform -chdir=infra/terraform/bootstrap fmt -check
          terraform -chdir=infra/terraform fmt -check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for committed secrets and keys
        run: |
          echo "Checking for committed secret files or private keys..."
          # Check for private keys
          if git grep -I -E "BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY" -- ':!*.md'; then
            echo "ERROR: Found private key in repository!"
            exit 1
          fi

          # Check for service account JSON files
          if git ls-files | grep -E ".*service-account.*\.json$"; then
            echo "ERROR: Found service account JSON file committed to repository!"
            exit 1
          fi

          # Check that no non-example .env file is tracked
          if git ls-files | grep -E "^\.env(\..+)?$" | grep -v "^\.env\.example$"; then
            echo "ERROR: Found committed .env file!"
            exit 1
          fi

          echo "Secret scan passed cleanly."
